<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<style>
body {
  margin: 0;
  background-color: #000;
  color: #fff;
  font-family: sans-serif;
  display: flex;
}
.sidebar {
  width: 250px;
  height: 100vh;
  position: fixed;
  padding: 40px 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.logo { font-size: 2rem; font-weight: bold; margin-bottom: 30px; }
.menu-section { margin-bottom: 20px; font-size: 0.8rem; color: #888; }
.menu-section div { margin-top: 10px; }
.menu-section a { color: #fff; text-decoration: none; display: block; margin: 5px 0; }
.menu-section a.active { color: #ff3333; }
.main-content {
  margin-left: 250px;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: calc(100% - 250px);
}
.main-content img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <div class="logo">DWiL<br>Gallery</div>
    <div class="lives">Live Archives</div>
    <div class="menu-section">
      2026:
      <div><a href="#" class="active">6/21(sun)<br>Do What I Love Shinsekai</a></div>
      <div><a href="#">AUTOMOTIVE</a></div>
      <div><a href="#">WILDLIFE</a></div>
      <div><a href="#">SPORTS</a></div>
    </div>
    <div class="menu-section">
      SOCIAL MEDIA:
      <div><a href="#">INSTAGRAM</a></div>
      <div><a href="#">FACEBOOK</a></div>
      <div><a href="#">LINKEDIN</a></div>
    </div>
    <div class="menu-section">
      INFORMATION:
      <div><a href="#">ABOUT</a></div>
      <div><a href="#">CONTACT</a></div>
    </div>
  </div>
  <div style="font-size: 0.7rem; color: #888;">&copy; All rights reserved</div>
</div>

<div class="main-content">
  <img src="image1.jpg" alt="">
  <img src="image2.jpg" alt="">
  <img src="image3.jpg" alt="">
  <img src="image4.jpg" alt="">
</div>

</body>
</html>
